[project]
name = "payment-service"
version = "0.1.0"
description = "Asynchronous payment processing microservice: FastAPI, PostgreSQL, RabbitMQ (FastStream), transactional outbox"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "faststream[rabbit]>=0.7.7",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "testcontainers[postgres,rabbitmq]>=4.15.0",
]

[tool.uv]
# A deployable service, not a library: dependencies only, the code runs from the source tree.
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "PT", "RET", "SIM",
    "ARG", "PTH", "ERA", "PL", "TRY", "RUF", "S", "ASYNC", "FAST",
]
ignore = [
    "PLR0913",  # explicit constructor arguments are fine for wiring classes
    "TRY003",   # short messages in exception constructors are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PLR2004", "ARG001"]
"migrations/**" = ["ERA001"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tools", "migrations", "tests"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "asgi_lifespan.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers -m 'not e2e'"
markers = [
    "e2e: end-to-end tests against a running `docker compose` stack (run with `-m e2e`)",
]
filterwarnings = [
    "error",
    # testcontainers internals
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning",
    "ignore:testcontainers.* is deprecated:DeprecationWarning",
]
